[project]
name = "antigravity-voice"
version = "1.0.0"
description = "Antigravity Voice Assistant for Windows with dedicated Copilot key hook"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.7.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pycaw>=20240210",
    "pywin32>=306",
    "faster-whisper>=1.0.3",
    "ctranslate2>=4.8.2",
    "onnxruntime>=1.18.0",
    "requests>=2.32.0",
    "comtypes>=1.4.0",
    "pynput>=1.7.7",
    "pillow>=10.0.0",
    "mss>=9.0.0",
    "huggingface-hub>=0.23.0",
]

[project.optional-dependencies]
vision = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.45.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.30.0",
    "qwen-vl-utils>=0.0.8",
]
